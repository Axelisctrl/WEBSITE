<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AXEL Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#050505;--card:#0e0e0f;--line:#232323;--tx:#f4f4f2;--mut:#98988f;--ac:#fff;--gl:#c6ff3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg)}
body{color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.sg,button,.nv{font-family:'Space Grotesk',Inter,sans-serif}
a{color:inherit;text-decoration:none}.w{max-width:1080px;margin:0 auto;padding:0 22px}
.page{display:none;animation:in .6s ease}.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* intro */
#intro{min-height:100vh;min-height:100dvh;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;position:relative;overflow:hidden;text-align:center}
#intro.on{display:flex}
#intro:before{content:"";position:absolute;width:760px;height:760px;max-width:150vw;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 62%)}
#intro:after{content:"";position:absolute;left:-6%;top:-10%;width:2px;height:60%;background:linear-gradient(#fff,transparent);transform:rotate(14deg);opacity:.55}
#intro>*{position:relative}
.im{width:clamp(110px,24vw,170px);animation:fl 5s ease-in-out infinite,in 1.2s ease}
.iw{width:clamp(220px,60vw,380px);animation:in 1.6s ease}
@keyframes fl{50%{transform:translateY(-9px)}}
.enter{margin-top:16px;border:1px solid #fff;background:none;color:#fff;padding:14px 46px;font:500 14px 'Space Grotesk';letter-spacing:.38em;text-transform:uppercase;cursor:pointer;transition:.3s;animation:in 2.2s ease}
.enter:hover{background:#fff;color:#000;letter-spacing:.5em}
/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(5,5,5,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:none}
nav.on{display:block}
nav .w{display:flex;align-items:center;justify-content:space-between;height:64px}
nav ul{display:flex;gap:28px;list-style:none;padding:0}
.nv{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);cursor:pointer;transition:.2s}
.nv:hover,.nv.cur{color:#fff}.nv.cur{border-bottom:1px solid #fff;padding-bottom:3px}
.burger{display:none;background:none;border:0;color:#fff;font-size:26px;cursor:pointer}
@media(max-width:700px){.burger{display:block}nav ul{display:none;position:absolute;top:64px;left:0;right:0;background:#050505;flex-direction:column;padding:20px 22px;gap:18px;border-bottom:1px solid var(--line)}nav ul.open{display:flex}}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer}
.btn{display:inline-block;background:#fff;color:#000;border:0;padding:13px 28px;font:700 14px 'Space Grotesk';letter-spacing:.06em;cursor:pointer;transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,255,255,.18)}
.btn.o{background:none;color:#fff;border:1px solid #444}.btn.o:hover{border-color:#fff;box-shadow:none}
.hero{padding:96px 0 70px;text-align:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;left:50%;top:-160px;width:760px;height:760px;max-width:150%;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,255,255,.08),transparent 62%)}
.hero>*{position:relative}
.eyebrow{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);margin-bottom:20px}
h1{font-size:clamp(36px,7vw,74px);line-height:1.03;letter-spacing:-.03em;max-width:860px;margin:0 auto 20px}
h1 em{font-style:normal;color:var(--gl)}
.lead{color:var(--mut);max-width:560px;margin:0 auto 32px;font-size:18px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin:56px auto 0;max-width:660px;background:var(--card)}
.stats div{padding:22px 8px}.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font:700 30px 'Space Grotesk'}.stats span{font-size:13px;color:var(--mut)}
section{padding:70px 0}
.kick{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gl);margin-bottom:10px}
h2{font-size:clamp(28px,4.5vw,46px);line-height:1.08;letter-spacing:-.02em;margin-bottom:12px}
.sub{color:var(--mut);max-width:540px;margin-bottom:36px}
.ph{padding:70px 0 10px;border-bottom:1px solid var(--line)}.ph .sub{margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);transition:.25s;display:flex;flex-direction:column;overflow:hidden}
.card:hover{border-color:#fff;transform:translateY(-5px)}
.th{height:130px;position:relative;display:grid;place-items:center;background:linear-gradient(135deg,#171717,#070707);border-bottom:1px solid var(--line)}
.th svg{width:44px;opacity:.9}.th i{position:absolute;top:12px;left:14px;font:700 11px 'Space Grotesk';letter-spacing:.18em;color:var(--gl);font-style:normal}
.cb{padding:22px;display:flex;flex-direction:column;flex:1}
.cb h3{font-size:21px;margin-bottom:8px}.cb p{color:var(--mut);font-size:15px;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;margin:18px 0 14px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
.meta b{color:#fff;font:700 20px 'Space Grotesk'}
.flt{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}
.chip{background:none;border:1px solid #333;color:var(--mut);padding:8px 18px;font:500 13px 'Space Grotesk';letter-spacing:.08em;cursor:pointer;transition:.2s}
.chip.on,.chip:hover{background:#fff;color:#000;border-color:#fff}
.docs{display:grid;gap:12px}
.doc{display:flex;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);padding:18px 20px;transition:.2s}
.doc:hover{border-color:#fff}.doc svg{width:40px;flex:none}.doc h3{font-size:18px}.doc small{color:var(--mut)}
.doc .btn{margin-left:auto;padding:10px 18px;font-size:12px;white-space:nowrap}
@media(max-width:560px){.doc{flex-wrap:wrap}.doc .btn{margin-left:58px}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:46px;align-items:center}
@media(max-width:780px){.two{grid-template-columns:1fr}}
.box{aspect-ratio:1;border:1px solid var(--line);background:radial-gradient(circle at 50% 40%,#1b1b1b,#060606);display:grid;place-items:center}
.box svg{width:44%}
.pp{color:var(--mut);margin-bottom:14px}
.steps{counter-reset:s;display:grid;gap:14px;margin-top:10px}
.steps div{counter-increment:s;border-left:2px solid #333;padding:2px 0 2px 18px;color:var(--mut)}
.steps div:before{content:"0" counter(s);font:700 13px 'Space Grotesk';color:var(--gl);margin-right:10px}
.steps b{color:#fff}
form{display:grid;gap:12px;max-width:520px}
input,textarea,select{width:100%;background:#0a0a0a;border:1px solid #333;color:#fff;padding:13px 16px;font:16px Inter,sans-serif;border-radius:0}
input:focus,textarea:focus{outline:0;border-color:#fff}
.ok{display:none;color:var(--gl);margin-top:8px}
.tst{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.tst div{border:1px solid var(--line);padding:24px;background:var(--card);color:var(--mut);font-size:15px}
.tst b{display:block;color:#fff;margin-top:14px;font:500 13px 'Space Grotesk';letter-spacing:.1em}
.faq details{border-bottom:1px solid var(--line);padding:16px 0;color:var(--mut)}
.faq summary{color:#fff;cursor:pointer;font:500 17px 'Space Grotesk'}
.art{max-width:720px;margin:0 auto;padding:56px 22px 20px}
.art h1{font-size:clamp(32px,5.4vw,54px);margin:0 0 26px;text-align:left;max-width:none}
.art .by{color:var(--mut);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:22px}
.art p{font-size:18px;line-height:1.85;color:#cfcfc8;margin-bottom:20px}
.art h3{font-size:28px;letter-spacing:-.01em;margin:48px 0 16px;color:#fff}
.art blockquote{font:700 clamp(22px,3.4vw,30px)/1.3 'Space Grotesk',sans-serif;border-left:3px solid var(--gl);padding:6px 0 6px 22px;margin:44px 0 36px;color:#fff}
.art .back{background:none;border:0;color:var(--mut);font:500 13px 'Space Grotesk';letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:0;margin-bottom:26px}
.art .back:hover{color:#fff}
.art .end{border-top:1px solid var(--line);margin-top:48px;padding-top:30px;display:flex;gap:12px;flex-wrap:wrap}
